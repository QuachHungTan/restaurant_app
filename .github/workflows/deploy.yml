name: CI/CD Pipeline - Restaurant App

# Tự động kích hoạt workflow khi có code push lên nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Kiểm tra mã nguồn và cú pháp (CI)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check Dependencies & Syntax
        run: |
          echo "Kiểm tra cú pháp và dependencies của Node.js..."
          npm install --package-lock-only

  # Job 2: Tự động kết nối SSH triển khai lên Server/VPS (CD)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Chuyển vào thư mục chứa Docker Compose trên máy chủ
            cd ~/Màn\ hình\ nền/restaurant_app/Db_BindMount || cd ~/restaurant_app/Db_BindMount
            
            # Kéo mã nguồn mới nhất về từ GitHub
            git pull origin main
            
            # Rebuild và cập nhật container Node.js Web không làm ngắt kết nối CSDL
            docker compose up -d --build web
            
            # Dọn dẹp Docker image cũ để tiết kiệm dung lượng đĩa
            docker image prune -f
